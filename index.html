<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RiotVolt - Developer & Student</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="main-wrapper">
    
    <div class="card profile-card" id="tilt-card">
      <img src="https://riotvolt.com/avatar.jpg" alt="RiotVolt Avatar" class="avatar">
      <div class="name-title">
        <h1>RiotVolt</h1>
        <p>Developer & Student</p>
      </div>
      <div class="buttons">
        <a href="https://github.com/RiotVolt" target="_blank" rel="noopener"><i class="fab fa-github"></i> GitHub</a>
        <a href="https://x.com/RiotVolt" target="_blank" rel="noopener"><i class="fab fa-x-twitter"></i> Twitter</a>
        <a href="mailto:contact@riotvolt.com"><i class="fas fa-envelope"></i> Email</a>
      </div>
    </div>

    <div class="card specs-card">
      <h2 class="specs-title">System Setup</h2>
      <div class="specs-list">
        
        <div class="spec-row">
          <div class="spec-label"><i class="fab fa-windows"></i> OS</div>
          <div class="spec-value">Windows 11</div>
        </div>

        <div class="spec-row">
          <div class="spec-label"><i class="fas fa-microchip"></i> Processor</div>
          <div class="spec-value">AMD Ryzen 7 5800X</div>
        </div>

        <div class="spec-row">
          <div class="spec-label"><i class="fas fa-memory"></i> Memory</div>
          <div class="spec-value">32 GB RAM</div>
        </div>

        <div class="spec-row">
          <div class="spec-label"><i class="fas fa-vr-cardboard"></i> Graphics</div>
          <div class="spec-value">NVIDIA RTX 3070 Ti</div>
        </div>

        <div class="spec-row">
          <div class="spec-label"><i class="fas fa-hard-drive"></i> Storage</div>
          <div class="spec-value">
            Samsung SSD 970 PRO 1TB<br>
            SEAGATE HDD 1TB<br>
          </div>
        </div>

      </div>
    </div>

  </div> 

  <footer class="site-footer">
    <div class="footer-content">
      <p><span>ᗜˬᗜ</span></p>
      <p>&copy; <span id="year"></span> RiotVolt. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
